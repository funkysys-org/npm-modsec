# In-container WAF smoke-test instance (second nginx master, port 8080).
# Uses the BLOCKING include chain — the smoke test must see 403s.
# (Engine flip via inline modsecurity_rules does not work; the blocking chain
# main-block.conf ends with `SecRuleEngine On` inside the rules set.)
# Proxy target is the compose "backend" service.
user root;
worker_processes 1;
pid /tmp/waf-test/nginx.pid;
error_log /tmp/waf-test/error.log warn;

load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    access_log off;

    server {
        listen 0.0.0.0:8080;
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsec/main-block.conf;

        location / {
            proxy_pass http://backend:8080;
        }
    }
}
